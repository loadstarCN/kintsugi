name: Bug report
description: Report a problem with Kintsugi
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report. Please fill in as much as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, pnpm version, database (PostgreSQL / MySQL) and version, LLM provider.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Relevant server logs, console errors, or screenshots. Please redact any secrets.
      render: shell
    validations:
      required: false
