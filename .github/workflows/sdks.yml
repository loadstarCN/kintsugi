name: SDKs (Python / Go / Java)

# 三家非 JS SDK 各自独立 toolchain，单独一个 workflow 文件好读 + paths 过滤省 CI 时间。
# 每个 job 都用 paths 过滤：只有改对应 packages/<lang>-sdk/** 时才跑。
# 主 ci.yml 不动这块（不依赖 pnpm / Node 链路）。

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/python-sdk/**'
      - 'packages/go-sdk/**'
      - 'packages/java-sdk/**'
      - '.github/workflows/sdks.yml'
  push:
    branches: [main]
    paths:
      - 'packages/python-sdk/**'
      - 'packages/go-sdk/**'
      - 'packages/java-sdk/**'
      - '.github/workflows/sdks.yml'
  workflow_dispatch:

jobs:
  python-sdk:
    name: Python SDK (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/python-sdk
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # NOTE: 主 ci.yml 上的 actions 都 SHA-pin 了；这三家 setup-* 我们暂用 major
      # tag，dependabot 跑一轮后会自动替换成 commit SHA。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          # pip cache key 默认看 requirements.txt；我们用 pyproject.toml，显式指过去
          cache-dependency-path: packages/python-sdk/pyproject.toml

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Pytest
        run: pytest -q

  go-sdk:
    name: Go SDK (go test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/go-sdk
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # 没有外部依赖 → 没有 go.sum；setup-go 会跳过 cache，不影响速度

      - name: go vet
        # vet 是免费午餐 —— 抓 Printf format / unreachable / shadow 等
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  java-sdk:
    name: Java SDK (mvn test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/java-sdk
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: mvn -B test
        run: mvn -B -ntp test
