name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.12.0'

jobs:
  build:
    name: Build server + web bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_id: ${{ steps.meta.outputs.id }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - id: meta
        run: echo "id=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        # prisma generate 只读 schema，不需要 DATABASE_URL
        run: pnpm --filter @kintsugi/server exec prisma generate

      - name: Build packages and apps
        # 构造一个最小的 .env 让 dotenv-cli / vite 不报错（无敏感值）
        run: |
          touch .env
          pnpm build

      - name: Bundle server (pnpm deploy --prod)
        run: |
          rm -rf /tmp/server-bundle
          pnpm --filter @kintsugi/server deploy --prod /tmp/server-bundle
          # pnpm deploy 不会把 prisma generate 产物（.prisma/client）拷进 bundle，
          # 这里从 pnpm 缓存里手动补一份，避免运行时 require('.prisma/client') 失败。
          PRISMA_CLIENT_DIR=$(find node_modules/.pnpm -maxdepth 4 -type d -path '*@prisma+client@*/node_modules/.prisma/client' | head -1)
          if [ -z "$PRISMA_CLIENT_DIR" ]; then
            echo "ERR: prisma generated client not found in pnpm store" >&2
            exit 1
          fi
          echo "found prisma client at: $PRISMA_CLIENT_DIR"
          mkdir -p /tmp/server-bundle/node_modules/.prisma
          cp -r "$(dirname "$PRISMA_CLIENT_DIR")"/* /tmp/server-bundle/node_modules/.prisma/
          tar -C /tmp/server-bundle -czf server-bundle.tar.gz .
          ls -lh server-bundle.tar.gz
          du -sh /tmp/server-bundle

      - name: Bundle web (vite dist)
        run: |
          tar -C apps/web/dist -czf web-bundle.tar.gz .
          ls -la web-bundle.tar.gz

      - name: Stage deploy artifacts
        run: |
          mkdir -p out
          mv server-bundle.tar.gz web-bundle.tar.gz out/
          cp deploy/pm2/ecosystem.config.cjs out/
          cp deploy/scripts/server-deploy.sh out/
          chmod +x out/server-deploy.sh
          ls -la out/

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deploy-${{ steps.meta.outputs.id }}
          path: out/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: deploy-${{ needs.build.outputs.release_id }}
          path: out

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            "${{ secrets.DEPLOY_USER }}@${DEPLOY_HOST}" 'echo "ssh ok: $(hostname)"'

      - name: Upload artifacts to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REL_ID: ${{ needs.build.outputs.release_id }}
        run: |
          STAGING="/tmp/kintsugi-deploy-${REL_ID}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${STAGING}"
          scp -p \
            out/server-bundle.tar.gz \
            out/web-bundle.tar.gz \
            out/ecosystem.config.cjs \
            out/server-deploy.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${STAGING}/"
          echo "STAGING=${STAGING}" >> "$GITHUB_ENV"

      - name: Run server-deploy.sh on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REL_ID: ${{ needs.build.outputs.release_id }}
        run: |
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/kintsugi}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -eu; chmod +x ${STAGING}/server-deploy.sh && \
             RELEASE_ID='${REL_ID}' DEPLOY_PATH='${DEPLOY_PATH}' STAGING='${STAGING}' \
             bash ${STAGING}/server-deploy.sh"
