# Kintsugi 控制台 nginx 配置
#
# 假设上游有 TLS 终止（云厂商 SLB / Caddy / Cloudflare）。本块只跑 80 + 静态/反代。
# 若直接对外，必须把 listen 80 替换成 listen 443 ssl + ssl_certificate*；并保留 80 做 301。
#
# 安全头来源：
#   - 前端是 SPA，不嵌入第三方页面，X-Frame-Options DENY 是安全默认
#   - PageRunner 子应用以 srcdoc iframe 在同源下渲染（不发外链 frame），不影响
#   - 子应用 srcdoc 里加载 unpkg.com 上的 React/AntD/Babel —— CSP 允许 unpkg 即可
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ----- 全局安全头（每个 location 都继承） -----
  # X-Frame-Options：禁止任何站点 iframe 我们的控制台，避免 clickjack 钩 token
  add_header X-Frame-Options "DENY" always;
  # 禁止 MIME sniff
  add_header X-Content-Type-Options "nosniff" always;
  # referrer 只发同源
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # HSTS：上游已 TLS 才有意义，留默认两年
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  # CSP（基线）：'self' 给前端自身资源；unpkg 允许 PageRunner 子应用拉 React/AntD/Babel；
  # data: blob: 给 echarts / 头像。'unsafe-eval' 给 Babel-standalone 转 JSX；
  # connect-src 'self' 让 fetch 走 /api 同源代理。
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https:; font-src 'self' data: https://unpkg.com; connect-src 'self'; frame-src 'self' data:; frame-ancestors 'none'; base-uri 'self';" always;
  # COOP / CORP：阻断 Spectre 类侧信道
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  # Permissions-Policy：默认收紧（启用某项时单独挑出来）
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

  # 前端静态资源 + SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API 代理到后端容器
  location /api/ {
    proxy_pass http://server:4000;

    # 头透传：保留 Host / 客户端 IP / 协议（让 server 端 cookie Secure 标志判断对得上）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 资产 import zip 默认 1MB 会 413；50MB 留有足够余地
    client_max_body_size 50m;

    # 关 buffering：未来 LLM streaming endpoint（chats stream / reports stream）才能流式
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;

    # LLM 调用单次 5 min 超时是常态，留 600s
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout 600s;
  }
}
